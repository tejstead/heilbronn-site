# Posts (or updates) the submission-verify report as a PR comment. Split from
# submission-verify.yml so fork PRs get comments too: this workflow has write
# permission but treats the artifact as data — it never checks out or runs
# code from the PR.
name: submission-comment

on:
  workflow_run:
    workflows: ["submission-verify"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'
    steps:
      - uses: actions/download-artifact@v4
        # The artifact only exists when the PR actually changed submission
        # dirs — a missing artifact just means there is nothing to post.
        continue-on-error: true
        with:
          name: submission-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('report.md') || !fs.existsSync('pr_number.txt')) {
              core.info('no report artifact — nothing to post');
              return;
            }
            const pr = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim(), 10);
            if (!Number.isInteger(pr)) { core.setFailed('bad pr_number.txt'); return; }
            let body = fs.readFileSync('report.md', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n*(truncated)*';
            const marker = '<!-- submission-verify -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, per_page: 100,
            });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr, body,
              });
            }
