<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}The Heilbronn Problem{% endblock %}</title>
<meta name="description" content="{% block description %}The Heilbronn problem for squares, triangles and convex regions: best known configurations with exact coordinates, proofs, and an interactive viewer.{% endblock %}">
{% if page_path %}
<link rel="canonical" href="{{ site_origin }}{{ page_path }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Heilbronn Problem">
<meta property="og:url" content="{{ site_origin }}{{ page_path }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:image" content="{{ site_origin }}{{ og_image or base ~ '/og.png' }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{% endif %}
<link rel="alternate" type="application/atom+xml" title="New Heilbronn records" href="{{ base }}/records.xml">
<link rel="stylesheet" href="{{ base }}/assets/{{ assets['site.css'] }}">
<link rel="icon" href="{{ base }}/favicon.ico" sizes="48x48">
<link rel="icon" href="{{ base }}/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ base }}/apple-touch-icon.png">
{% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <nav>
    <a class="brand" href="{{ base }}/">Heilbronn</a>
    <a href="{{ base }}/square/"{% if section == 'square' %} aria-current="page"{% endif %}>Square</a>
    <a href="{{ base }}/triangle/"{% if section == 'triangle' %} aria-current="page"{% endif %}>Triangle</a>
    <a href="{{ base }}/convex/"{% if section == 'convex' %} aria-current="page"{% endif %}>Convex</a>
    <a href="{{ base }}/trends/"{% if section == 'trends' %} aria-current="page"{% endif %}>Trends</a>
    <a href="{{ base }}/leaderboard/"{% if section == 'leaderboard' %} aria-current="page"{% endif %}>Leaderboard</a>
    <a href="{{ base }}/verifier/"{% if section == 'verifier' %} aria-current="page"{% endif %}>Verifier</a>
    <a href="{{ base }}/methods/"{% if section == 'methods' %} aria-current="page"{% endif %}>Methods</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <p>Every figure is regenerated from exactly verified coordinates.
  See <a href="{{ base }}/methods/">methods &amp; attribution</a>.</p>
</footer>
</body>
</html>
